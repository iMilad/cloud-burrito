<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Burrito</title>
  <link rel="icon" type="image/svg+xml" href="assets/cloud-burrito-icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="watchlist.css" />
</head>
<body class="wl" data-focus="list">
  <header class="wl-top">
    <a class="wl-logo" href="watchlist.html"><span class="wl-logo-mark" aria-hidden="true">cb</span>cloud burrito</a>
    <label class="wl-filter">
      <kbd aria-hidden="true">/</kbd>
      <input id="wl-filter" type="search" placeholder="Filter your things" aria-label="Filter your things"
        autocomplete="off" spellcheck="false" />
    </label>
    <p id="wl-summary" class="wl-meta" aria-live="polite"></p>
    <span class="wl-grow"></span>
    <p id="wl-sso" class="wl-meta" hidden></p>
    <span id="wl-mode" class="wl-mode" hidden></span>
    <button id="wl-classic" class="wl-link" type="button">Classic view</button>
  </header>
  <main id="watchlist-main" class="wl-main">
    <section id="wl-list" class="wl-list" aria-label="Your things" tabindex="-1"></section>
    <section id="wl-inspector" class="wl-inspector" aria-label="Inspector" tabindex="-1"></section>
  </main>
  <footer id="wl-keys" class="wl-keys" aria-label="Keyboard shortcuts"></footer>
  <div id="wl-notice" class="wl-notice" role="status" hidden></div>
  <p id="clipboard-status" class="sr-only" role="status"></p>
  <p id="result-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <script src="demo-bridge.js"></script>
  <script src="core.js"></script>
  <script src="things.js"></script>
  <script src="keys.js"></script>
  <script src="inspector.js"></script>
  <script src="watchlist.js"></script>
</body>
</html>
