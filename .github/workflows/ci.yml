name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Check frontend syntax
        shell: bash
        run: |
          node --check frontend/app.js
          node --check frontend/mock-data.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser mode
        run: npm run test:frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Assert no AWS credentials are present
        shell: bash
        run: |
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -z "${AWS_PROFILE:-}"

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-host-${{ hashFiles('rust-toolchain.toml', 'scripts/tool-versions.env', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-host-

      - name: Check release metadata
        run: python3 scripts/check-release-version.py

      - name: Run privacy scan
        run: python3 scripts/check-release-privacy.py

      - name: Check script syntax
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/check-release-privacy.py \
            scripts/check-release-version.py \
            scripts/release-status.py \
            scripts/check-tauri-commands.py
          bash -n scripts/*.sh

      - name: Test release helpers
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'

      - name: Check Tauri command registry
        run: python3 scripts/check-tauri-commands.py

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test -p cloud-burrito --locked

      - name: Lint Rust backend
        working-directory: src-tauri
        run: cargo clippy -p cloud-burrito --locked -- -D warnings

      - name: Install pinned Cargo Audit
        shell: bash
        run: |
          source scripts/tool-versions.env
          installed="$(cargo audit --version 2>/dev/null | awk '{print $NF}' || true)"
          if [[ "$installed" != "$CARGO_AUDIT_VERSION" ]]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          fi

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Check whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
