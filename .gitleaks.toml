title = "Cloud Burrito gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and ignored local build artifacts are not publishable source. dist/ holds release-build manifests full of file hashes; .claude/worktrees/ holds other local checkouts, each scanned on its own."
paths = [
  '''^src-tauri/gen/''',
  '''^src-tauri/target/''',
  '''^dist/''',
  '''^\.claude/worktrees/''',
]

[[allowlists]]
description = "The removed frontend/studio.js keeps the exact public Studio localStorage key in git history. It is not a credential, and the history scan still needs this."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^frontend/studio\.js$''']
regexTarget = "secret"
regexes = ['''^cb\.presentation\.v1$''']
